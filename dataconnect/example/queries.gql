mutation InsertUser($data: User_Data!) @auth(level: USER) {
  user_insert(data: $data)
}

mutation UpsertUser($data: User_Data!) @auth(level: USER) {
  user_upsert(data: $data)
}

mutation UpdateUser($key: User_Key!, $data: User_Data!) @auth(level: USER) {
  user_update(key: $key, data: $data)
}

mutation DeleteUser($key: User_Key!) @auth(level: USER) {
  user_delete(key: $key)
}

query GetUser($key: User_Key!) @auth(level: USER) {
  user(key: $key) {
    id
    email
    username
    createdAt
  }
}

query ListUsers @auth(level: USER) {
  users {
    id
    email
    username
  }
}

mutation InsertDevice($data: Device_Data!) @auth(level: USER) {
  device_insert(data: $data)
}

mutation UpsertDevice($data: Device_Data!) @auth(level: USER) {
  device_upsert(data: $data)
}

mutation UpdateDevice($key: Device_Key!, $data: Device_Data!) @auth(level: USER) {
  device_update(key: $key, data: $data)
}

mutation DeleteDevice($key: Device_Key!) @auth(level: USER) {
  device_delete(key: $key)
}

query GetDevice($key: Device_Key!) @auth(level: USER) {
  device(key: $key) {
    id
    deviceName
    operatingSystem
    lastSeen
  }
}

query ListMyDevices @auth(level: USER) {
  devices(where: {userId: {eq_expr: "auth.uid"}}) {
    id
    deviceName
  }
}

